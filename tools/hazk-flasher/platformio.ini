[platformio]
extra_configs =
  credentials.ini
default_envs = xiao_esp32s3

; The WiFi credentials are optional. The file `credentials.ini` replaces this
; section with its own [secret] section. That enables the web interface, the
; OTA and the network bridge.
;
; Note: without that file, the firmware builds without WiFi. The USB serial
; console then controls all functions.
[secret]
build_flags =

[env]
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv

build_flags =
    !echo "-DVERSION='\"g$(git describe --tags --always --dirty)\"'"
    ${secret.build_flags}

; == Seeed XIAO ESP32-S3 (the current board) ==
; The STM32 link is UART1 on the pins D0 and D1.
;
; Note: the firmware does not use UART0. The ROM of the S3 writes boot messages
; on that port at each reset. Those messages corrupt the bootloader sequence.
;
; Note: the debug console uses the native USB-Serial/JTAG port. Thus it needs
; no pins on the header.
;   D0/GPIO1 -> STM32 PA10 (USART1_RX)   D3/GPIO4 -> BOOT0
;   D1/GPIO2 -> STM32 PA9  (USART1_TX)   D4/GPIO5 -> NRST
[env:xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3

build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DSTM_TX_PIN=1
    -DSTM_RX_PIN=2
    -DPIN_BOOT0=4
    -DPIN_RST=5
    -DPIN_LED=21
    -DLED_ACTIVE_LOW
    -DNRST_OPEN_DRAIN

; This environment updates the flasher over the air.
;
; Note: the ArduinoOTA.setHostname() call sets the mDNS name. If the network
; does not support mDNS, set upload_port in credentials.ini.
[env:xiao_esp32s3_ota]
extends = env:xiao_esp32s3

upload_protocol = espota
upload_port = hazk-flasher.local

; == Waveshare ESP32 One (the first board, kept for reference) ==
[env:waveshare_esp32_one]
platform = espressif32
board = esp32dev
upload_speed = 921600

[env:waveshare_esp32_one_ota]
extends = env:waveshare_esp32_one

upload_protocol = espota

; To monitor the target, add a monitor_port line to credentials.ini.
; Use the form socket://<address>:<port>.
